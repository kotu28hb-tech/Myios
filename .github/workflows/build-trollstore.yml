name: Build Native iOS Mirror & Control

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Tai ma nguon tu repo Myios
        uses: actions/checkout@v4

      - name: Cai dat ldid
        run: brew install ldid

      - name: Kiem tra cu phap XML & Bien dich server.m
        run: |
          plutil -lint Info.plist
          plutil -lint entitlements.plist
          
          mkdir -p Payload/iOSMirror.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          xcrun -sdk iphoneos clang -arch arm64 \
            -isysroot "$SDK_PATH" \
            -mios-version-min=15.0 \
            -fobjc-arc \
            -framework Foundation -framework UIKit -framework CoreGraphics -framework ReplayKit -framework CoreImage -framework CoreMedia -framework CoreVideo -framework AVFoundation -framework IOKit \
            server.m -o Payload/iOSMirror.app/iOSMirror

          cp Info.plist Payload/iOSMirror.app/Info.plist
          ldid -Sentitlements.plist Payload/iOSMirror.app/iOSMirror
          zip -r iOSMirror_TrollStore.ipa Payload

      - name: Xuat file IPA thanh pham
        uses: actions/upload-artifact@v4
        with:
          name: iOSMirror-IPA
          path: iOSMirror_TrollStore.ipa