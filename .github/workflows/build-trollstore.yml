name: Build WebDriverAgent TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-wda:
    runs-on: macos-latest

    steps:
      - name: Tai cau hinh repo
        uses: actions/checkout@v4

      - name: Cai dat cong cu ldid
        run: brew install ldid

      - name: Tai ma nguon WebDriverAgent chinh chu
        run: git clone --depth 1 https://github.com/appium/WebDriverAgent.git wda_src

      - name: Bien dich WebDriverAgentRunner (Tuong thich iOS 15-16)
        run: |
          cd wda_src
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_out \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            ENABLE_TESTING_SEARCH_PATHS=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Loc bo Mach-O loi va dong goi file IPA chuan
        run: |
          mkdir -p Payload
          APP_PATH=$(find wda_src/build_out -name "WebDriverAgentRunner-Runner.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          
          # Xoa chu ky cu va thu vien Testing moi cua Xcode 26 gay loi ldid tren iOS 16
          find Payload/WebDriverAgentRunner-Runner.app -name "_CodeSignature" -exec rm -rf {} +
          rm -rf Payload/WebDriverAgentRunner-Runner.app/Frameworks/Testing.framework
          rm -rf Payload/WebDriverAgentRunner-Runner.app/Frameworks/_Testing_Foundation.framework
          
          # Kiem tra tung file Mach-O trong Frameworks, file nao loi ldid thi xoa bo
          if [ -d "Payload/WebDriverAgentRunner-Runner.app/Frameworks" ]; then
            for item in Payload/WebDriverAgentRunner-Runner.app/Frameworks/*; do
              if [ -d "$item" ]; then
                bin_name=$(basename "$item" .framework)
                if [ -f "$item/$bin_name" ]; then
                  if ! ldid -S "$item/$bin_name" 2>/dev/null; then
                    echo "Xoa framework khong tuong thich: $item"
                    rm -rf "$item"
                  fi
                fi
              elif [ -f "$item" ]; then
                if ! ldid -S "$item" 2>/dev/null; then
                  echo "Xoa dylib khong tuong thich: $item"
                  rm -f "$item"
                fi
              fi
            done
          fi
          
          # Gan quyen TrollStore vao 2 file thuc thi chinh
          ldid -Sentitlements.plist Payload/WebDriverAgentRunner-Runner.app/WebDriverAgentRunner-Runner
          ldid -Sentitlements.plist Payload/WebDriverAgentRunner-Runner.app/PlugIns/WebDriverAgentRunner.xctest/WebDriverAgentRunner
          
          zip -r WDA_TrollStore.ipa Payload

      - name: Xuat file IPA thanh pham
        uses: actions/upload-artifact@v4
        with:
          name: WDA-TrollStore-IPA
          path: WDA_TrollStore.ipa