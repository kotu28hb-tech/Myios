name: Build WebDriverAgent TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-wda:
    runs-on: macos-latest

    steps:
      - name: Tai cau hinh repo
        uses: actions/checkout@v4

      - name: Cai dat cong cu ldid
        run: brew install ldid

      - name: Tai ma nguon WebDriverAgent chinh chu
        run: git clone --depth 1 https://github.com/appium/WebDriverAgent.git wda_src

      - name: Bien dich WebDriverAgentLib (Static Library)
        run: |
          cd wda_src
          xcodebuild build \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentLib \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_out \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            MACH_O_TYPE=staticlib \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Dong goi ung dung doc lap WDA.app cho TrollStore
        run: |
          mkdir -p Payload/WDA.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          PLAT_PATH=$(xcrun --sdk iphoneos --show-sdk-platform-path)
          
          # Tim chinh xac file thu vien tinh da build
          LIB_PATH=$(find wda_src/build_out/Build/Products -name "WebDriverAgentLib" -o -name "libWebDriverAgentLib.a" | head -n 1)
          echo "Thu vien tim thay: $LIB_PATH"
          
          # Tu dong thu thap tat ca thu muc chua file .h trong wda_src
          INC_FLAGS=$(find wda_src/WebDriverAgentLib wda_src/PrivateHeaders -type d 2>/dev/null | sed 's/^/-I/')
          
          # Bien dich bang clang++ de ho tro ca Objective-C va C++ ben trong WDA
          xcrun -sdk iphoneos clang++ -arch arm64 \
            -isysroot "$SDK_PATH" \
            -mios-version-min=15.0 \
            -ObjC -fobjc-arc \
            -Iwda_src \
            $INC_FLAGS \
            -F"$PLAT_PATH/Developer/Library/Frameworks" \
            -F"$PLAT_PATH/Developer/Library/PrivateFrameworks" \
            -framework Foundation -framework UIKit -framework CoreGraphics -framework CoreMedia -framework CoreVideo -framework VideoToolbox -framework AVFoundation -framework MobileCoreServices -framework SystemConfiguration -framework Security -framework IOKit -framework XCTest \
            wda_main.m "$LIB_PATH" -o Payload/WDA.app/WDA

          # Tao Info.plist chuan
          cat << 'EOF' > Payload/WDA.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>WDA</string>
              <key>CFBundleIdentifier</key>
              <string>com.kotu28hb.wda</string>
              <key>CFBundleName</key>
              <string>WDA</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIBackgroundModes</key>
              <array>
                  <string>audio</string>
                  <string>voip</string>
              </array>
          </dict>
          </plist>
          EOF

          # Gan quyen TrollStore va kiem tra tinh hop le cua file Mach-O
          ldid -Sentitlements.plist Payload/WDA.app/WDA
          zip -r WDA_TrollStore.ipa Payload

      - name: Xuat file IPA thanh pham
        uses: actions/upload-artifact@v4
        with:
          name: WDA-TrollStore-IPA
          path: WDA_TrollStore.ipa