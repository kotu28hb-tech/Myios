name: Build TrollVNC iOS 16

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-trollvnc:
    runs-on: macos-latest

    steps:
      - name: Tai cau hinh repo
        uses: actions/checkout@v4

      - name: Cai dat cong cu build Theos & ldid
        run: |
          brew install ldid dpkg xz
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/sdks
          curl -L https://github.com/xybp888/iOS-SDKs/releases/download/iOS-SDKs/iPhoneOS16.5.sdk.tar.xz -o sdk.tar.xz
          tar -xf sdk.tar.xz -C $HOME/theos/sdks/

      - name: Tai ma nguon TrollVNC (Chuyen biet cho TrollStore iOS 16)
        run: git clone --recursive https://github.com/Lessica/TrollVNC.git vnc_src

      - name: Bien dich file IPA chuan khong can Developer Mode
        run: |
          export THEOS=$HOME/theos
          cd vnc_src
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          
          # Dong goi thanh file .ipa cho TrollStore
          mkdir -p Payload
          APP_DIR=$(find .theos -name "*.app" | head -n 1)
          cp -r "$APP_DIR" Payload/
          zip -r ../TrollVNC_iOS16.ipa Payload

      - name: Xuat file IPA thanh pham
        uses: actions/upload-artifact@v4
        with:
          name: TrollVNC-iOS16-IPA
          path: TrollVNC_iOS16.ipa