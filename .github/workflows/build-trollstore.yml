name: Build TrollVNC Official Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-trollvnc:
    runs-on: macos-latest

    steps:
      - name: Tai ma nguon owngoal-dev/TrollVNC
        run: git clone --recursive https://github.com/owngoal-dev/TrollVNC.git vnc_src

      - name: Cai dat Theos, ldid va SDK 16.5
        run: |
          brew install ldid dpkg
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $HOME/theos_sdks
          cp -r $HOME/theos_sdks/iPhoneOS16.5.sdk "$HOME/theos/sdks/"

      - name: Bien dich va dong goi chuan cau truc TrollVNC
        run: |
          export THEOS=$HOME/theos
          export SYSROOT="$HOME/theos/sdks/iPhoneOS16.5.sdk"
          cd vnc_src
          
          # Bo qua module Jailbreak (prefs, cc) va tat -fmodules
          sed -i '' 's/SUBPROJECTS.*/SUBPROJECTS = app\/TrollVNC/' Makefile
          make stage FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ADDITIONAL_CFLAGS="-fno-modules" ADDITIONAL_OBJCFLAGS="-fno-modules"
          
          # Kiem tra cau truc thu muc stage de dong goi chinh xac
          STAGE_DIR=".theos/_/var/jb"
          mkdir -p Payload/TrollVNC.app
          
          APP_SRC=$(find "$STAGE_DIR" -name "TrollVNC.app" | head -n 1)
          cp -rn "$APP_SRC/"* Payload/TrollVNC.app/
          
          # Chep trollvncserver va cap quyen thuc thi +x
          SRV_SRC=$(find "$STAGE_DIR" -name "trollvncserver" -type f | head -n 1)
          cp "$SRV_SRC" Payload/TrollVNC.app/trollvncserver
          chmod +x Payload/TrollVNC.app/TrollVNC
          chmod +x Payload/TrollVNC.app/trollvncserver
          
          # Ky entitlements rieng cho tung file thuc thi
          ldid -Sapp/TrollVNC/entitlements.plist Payload/TrollVNC.app/TrollVNC 2>/dev/null || ldid -Sentitlements.plist Payload/TrollVNC.app/TrollVNC
          ldid -Sentitlements.plist Payload/TrollVNC.app/trollvncserver
          
          zip -r ../TrollVNC_Fixed.tipa Payload

      - name: Xuat file TrollVNC_Fixed.tipa
        uses: actions/upload-artifact@v4
        with:
          name: TrollVNC-Fixed-TIPA
          path: TrollVNC_Fixed.tipa