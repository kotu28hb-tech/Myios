name: Build TrollVNC iOS 16

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  get-trollvnc:
    runs-on: macos-latest

    steps:
      - name: Tai ban phat hanh TrollVNC IPA chinh thuc tu 82Flex
        run: |
          # Lay URL file .ipa moi nhat tu GitHub Releases cua 82Flex/TrollVNC
          IPA_URL=$(curl -s https://api.github.com/repos/82Flex/TrollVNC/releases/latest | grep "browser_download_url.*\.ipa" | cut -d '"' -f 4 | head -n 1)
          
          if [ -n "$IPA_URL" ]; then
            echo "Tim thay ban phat hanh chuan: $IPA_URL"
            curl -L "$IPA_URL" -o TrollVNC_iOS16.ipa
          else
            echo "Khong tim thay file .ipa san, chuyen sang tu bien dich tu 82Flex/TrollVNC..."
            brew install ldid dpkg
            git clone --recursive https://github.com/theos/theos.git $HOME/theos
            mkdir -p $HOME/theos/sdks
            ln -s "$(xcrun --sdk iphoneos --show-sdk-path)" "$HOME/theos/sdks/iPhoneOS.sdk"
            
            git clone --recursive https://github.com/82Flex/TrollVNC.git vnc_src
            export THEOS=$HOME/theos
            export SYSROOT="$HOME/theos/sdks/iPhoneOS.sdk"
            cd vnc_src
            make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
            mkdir -p Payload
            APP_DIR=$(find .theos -name "*.app" | head -n 1)
            cp -r "$APP_DIR" Payload/
            zip -r ../TrollVNC_iOS16.ipa Payload
          fi

      - name: Xuat file IPA thanh pham
        uses: actions/upload-artifact@v4
        with:
          name: TrollVNC-iOS16-IPA
          path: TrollVNC_iOS16.ipa