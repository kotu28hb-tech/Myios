name: Build WebDriverAgent TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-wda:
    runs-on: macos-latest

    steps:
      - name: Tai cau hinh repo
        uses: actions/checkout@v4

      - name: Cai dat cong cu ldid
        run: brew install ldid

      - name: Tai ma nguon WebDriverAgent chinh chu
        run: git clone --depth 1 https://github.com/appium/WebDriverAgent.git wda_src

      - name: Bien dich WebDriverAgentRunner (Khong can tai khoan Apple Dev)
        run: |
          cd wda_src
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_out \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Gan quyen TrollStore va dong goi file IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find wda_src/build_out -name "WebDriverAgentRunner-Runner.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          
          # Ky quyen cho toan bo binary va framework ben trong WDA
          find Payload/WebDriverAgentRunner-Runner.app -type f \( -name "*.dylib" -o -perm +111 \) -exec ldid -Sentitlements.plist {} \;
          
          zip -r WDA_TrollStore.ipa Payload

      - name: Xuat file IPA thanh pham
        uses: actions/upload-artifact@v4
        with:
          name: WDA-TrollStore-IPA
          path: WDA_TrollStore.ipa