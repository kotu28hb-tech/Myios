name: Build TrollVNC from owngoal-dev

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-trollvnc:
    runs-on: macos-latest

    steps:
      - name: Tai ma nguon owngoal-dev/TrollVNC
        run: git clone --recursive https://github.com/owngoal-dev/TrollVNC.git vnc_src

      - name: Cai dat Theos, ldid va SDK
        run: |
          brew install ldid dpkg
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/sdks
          ln -s "$(xcrun --sdk iphoneos --show-sdk-path)" "$HOME/theos/sdks/iPhoneOS.sdk"

      - name: Bien dich goi cai dat TrollStore
        run: |
          export THEOS=$HOME/theos
          export SYSROOT="$HOME/theos/sdks/iPhoneOS.sdk"
          cd vnc_src
          
          # Chay script dong goi co san cua TrollVNC neu co, hoac build bang make
          if [ -f "devkit/build-tipa.sh" ]; then
            chmod +x devkit/build-tipa.sh
            ./devkit/build-tipa.sh
          elif [ -f "build_trollstore.sh" ]; then
            chmod +x build_trollstore.sh
            ./build_trollstore.sh
          else
            make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          fi
          
          # Gom file .tipa hoac .ipa thanh pham
          OUT_FILE=$(find . -maxdepth 3 \( -name "*.tipa" -o -name "*.ipa" \) | head -n 1)
          if [ -n "$OUT_FILE" ]; then
            cp "$OUT_FILE" ../TrollVNC_iOS16.tipa
          else
            mkdir -p Payload
            APP_DIR=$(find .theos -name "*.app" | head -n 1)
            cp -r "$APP_DIR" Payload/
            zip -r ../TrollVNC_iOS16.tipa Payload
          fi

      - name: Xuat file TrollVNC_iOS16.tipa
        uses: actions/upload-artifact@v4
        with:
          name: TrollVNC-iOS16-TIPA
          path: TrollVNC_iOS16.tipa