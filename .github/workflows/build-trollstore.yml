name: Build TrollVNC Fast

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-trollvnc:
    runs-on: macos-latest
    timeout-minutes: 8

    steps:
      - name: Tai ma nguon owngoal-dev/TrollVNC
        run: git clone --depth 1 --recursive https://github.com/owngoal-dev/TrollVNC.git vnc_src

      - name: Cai dat Theos, ldid va SDK 16.5
        run: |
          brew install ldid dpkg
          git clone --depth 1 --recursive https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/sdks
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git $HOME/theos_sdks
          cd $HOME/theos_sdks && git sparse-checkout set iPhoneOS16.5.sdk
          cp -r $HOME/theos_sdks/iPhoneOS16.5.sdk "$HOME/theos/sdks/"

      - name: Bien dich da nhan va dong goi chuan TrollStore
        run: |
          export THEOS=$HOME/theos
          export SYSROOT="$HOME/theos/sdks/iPhoneOS16.5.sdk"
          cd vnc_src
          
          sed -i '' 's/SUBPROJECTS.*/SUBPROJECTS = app\/TrollVNC/' Makefile
          make stage -j$(sysctl -n hw.ncpu) FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ADDITIONAL_CFLAGS="-fno-modules" ADDITIONAL_OBJCFLAGS="-fno-modules"
          
          mkdir -p Payload/TrollVNC.app
          
          APP_SRC=$(find .theos -type d -name "TrollVNC.app" | head -n 1)
          SRV_SRC=$(find .theos -type f -name "trollvncserver" | head -n 1)
          
          cp -rn "$APP_SRC/"* Payload/TrollVNC.app/
          cp "$SRV_SRC" Payload/TrollVNC.app/trollvncserver
          chmod 755 Payload/TrollVNC.app/TrollVNC
          chmod 755 Payload/TrollVNC.app/trollvncserver
          
          # Tu dong tim dung file entitlements ben trong repo (khong bao loi neu khac ten)
          APP_ENT=$(find . -name "*entitlements*.plist" | grep -i "app\|TrollVNC" | head -n 1)
          SRV_ENT=$(find . -name "*entitlements*.plist" | grep -vi "app\|TrollVNC" | head -n 1)
          
          if [ -n "$APP_ENT" ] && [ -f "$APP_ENT" ]; then
            ldid -S"$APP_ENT" Payload/TrollVNC.app/TrollVNC
          fi
          if [ -n "$SRV_ENT" ] && [ -f "$SRV_ENT" ]; then
            ldid -S"$SRV_ENT" Payload/TrollVNC.app/trollvncserver
          fi
          
          zip -r ../TrollVNC_Fixed.tipa Payload

      - name: Xuat file TrollVNC_Fixed.tipa
        uses: actions/upload-artifact@v4
        with:
          name: TrollVNC-Fixed-TIPA
          path: TrollVNC_Fixed.tipa