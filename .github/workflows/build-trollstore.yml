name: Build Native iOS Mirror & Control

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Tai ma nguon tu repo Myios
        uses: actions/checkout@v4

      - name: Cai dat ldid
        run: brew install ldid

      - name: Bien dich server.m thanh file IPA TrollStore
        run: |
          mkdir -p Payload/iOSMirror.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          xcrun -sdk iphoneos clang -arch arm64 \
            -isysroot "$SDK_PATH" \
            -mios-version-min=15.0 \
            -fobjc-arc \
            -framework Foundation -framework UIKit -framework ReplayKit -framework CoreImage -framework CoreMedia -framework CoreVideo -framework AVFoundation -framework IOKit \
            server.m -o Payload/iOSMirror.app/iOSMirror

          cat << 'EOF' > Payload/iOSMirror.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>iOSMirror</string>
              <key>CFBundleIdentifier</key>
              <string>com.kotu28hb.iosmirror</string>
              <key>CFBundleName</key>
              <string>iOSMirror</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIBackgroundModes</key>
              <array>
                  <string>audio</string>
                  <string>voip</string>
              </array>
          </dict>
          </plist>
          EOF

          ldid -Sentitlements.plist Payload/iOSMirror.app/iOSMirror
          zip -r iOSMirror_TrollStore.ipa Payload

      - name: Xuat file IPA thanh pham
        uses: actions/upload-artifact@v4
        with:
          name: iOSMirror-IPA
          path: iOSMirror_TrollStore.ipa